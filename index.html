<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F0;
    --surface:#FFFFFF;
    --ink:#22221D;
    --ink-muted:#79776C;
    --line:#E1DED2;
    --accent:#3F5C55;
    --accent-soft:#DEE7E2;
    --done:#9CA88F;
    --danger:#B4573F;
    --radius:3px;
  }
  [data-theme="dark"]{
    --bg:#1B1C18;
    --surface:#242520;
    --ink:#EDEBE2;
    --ink-muted:#928F80;
    --line:#3A3B33;
    --accent:#8FB6A9;
    --accent-soft:#2E3A34;
    --done:#6C7A61;
    --danger:#D97A63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .2s, color .2s;
  }
  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:48px 24px 80px;
    transition: opacity 0.3s;
  }
  .wrap.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  /* Auth Screen */
  .auth-overlay{
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    background: linear-gradient(135deg, var(--bg) 0%, var(--accent-soft) 100%);
    z-index:200;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .auth-overlay.hidden{
    opacity: 0;
    visibility: hidden;
  }
  .auth-card{
    background: var(--surface);
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    text-align: center;
    max-width: 360px;
    width: 90%;
    border: 1px solid var(--line);
    transform: translateY(0);
    transition: transform 0.5s ease;
  }
  .auth-overlay.hidden .auth-card {
    transform: translateY(20px);
  }
  .auth-title{
    font-family: 'Fraunces', serif;
    font-size: 28px;
    color: var(--ink);
    margin: 0 0 8px 0;
  }
  .auth-subtitle{
    font-size: 14px;
    color: var(--ink-muted);
    margin-bottom: 32px;
    line-height: 1.4;
  }
  .google-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    background: #fff;
    color: #3c4043;
    border: 1px solid #dadce0;
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .google-btn:hover{
    background: #f8f9fa;
    box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
  }
  .google-icon{
    width: 18px; height: 18px;
  }
  [data-theme="dark"] .auth-overlay {
    background: linear-gradient(135deg, #111 0%, #1a221f 100%);
  }
  [data-theme="dark"] .auth-card {
    background: var(--surface);
    border-color: var(--line);
  }
  
  .sign-out-btn {
    font-size: 12px;
    color: var(--ink-muted);
    background: none;
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    margin-left: 12px;
  }
  .sign-out-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
  }
  
  /* Loading Overlay */
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    font-family: 'Fraunces', serif;
    font-size: 20px;
    transition: opacity 0.3s;
  }
  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Header */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
    margin-bottom:32px;
    gap:16px;
    flex-wrap:wrap;
  }
  .date-block{display:flex; align-items:center; gap:14px;}
  .nav-btn{
    background:none;
    border:1px solid var(--line);
    width:32px; height:32px;
    border-radius:50%;
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s, background .15s;
  }
  .nav-btn:hover{border-color:var(--accent); background:var(--accent-soft);}
  .date-text h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:34px;
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
  }
  .date-text p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--ink-muted);
  }
  .today-btn{
    background:none;
    border:none;
    color:var(--accent);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
    padding:0;
    margin-top:4px;
  }
  .progress{
    text-align:right;
    min-width:150px;
  }
  .progress .num{
    font-family:'Fraunces',serif;
    font-size:26px;
    color:var(--accent);
  }
  .progress .lbl{
    font-size:12px;
    color:var(--ink-muted);
    margin-top:2px;
  }
  .progress-bar{
    width:150px;
    height:3px;
    background:var(--line);
    margin-top:8px;
    border-radius:2px;
    overflow:hidden;
  }
  .progress-bar > div{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }

  .theme-toggle{
    background:none;
    border:1px solid var(--line);
    width:32px; height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
    margin-left:12px;
  }
  .theme-toggle:hover{border-color:var(--accent); background:var(--accent-soft);}
  .header-right{display:flex; align-items:flex-end;}

  .repeat-badge{
    font-size:9.5px;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:8px;
    padding:1px 6px;
    flex:0 0 auto;
  }
  .time-edit{
    flex:0 0 62px;
    font-size:12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--bg);
    color:var(--ink);
    padding:2px;
    font-family:'Inter',sans-serif;
  }
  .add-row label.repeat-lbl{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    color:var(--ink-muted);
    white-space:nowrap;
  }

  /* Calendar picker */
  .date-block{position:relative;}
  .cal-toggle{
    background:none;
    border:1px solid var(--line);
    height:32px;
    padding:0 12px;
    border-radius:16px;
    color:var(--ink);
    font-size:12px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:border-color .15s, background .15s;
  }
  .cal-toggle:hover{border-color:var(--accent); background:var(--accent-soft);}
  .cal-popover{
    display:none;
    position:absolute;
    top:100%;
    left:0;
    margin-top:10px;
    width:272px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(34,34,29,0.10);
    padding:16px;
    z-index:20;
  }
  .cal-popover.open{display:block;}
  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-head span{
    font-family:'Fraunces',serif;
    font-size:15px;
  }
  .cal-head button{
    background:none;
    border:none;
    color:var(--ink-muted);
    font-size:14px;
    cursor:pointer;
    padding:2px 6px;
  }
  .cal-head button:hover{color:var(--accent);}
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:2px;
    text-align:center;
  }
  .cal-grid .dow{
    font-size:10.5px;
    color:var(--ink-muted);
    padding-bottom:6px;
  }
  .cal-day{
    background:none;
    border:none;
    border-radius:50%;
    width:32px; height:32px;
    font-size:12.5px;
    color:var(--ink);
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .cal-day:hover{background:var(--accent-soft);}
  .cal-day.other-month{color:var(--line);}
  .cal-day.today{border:1px solid var(--accent); color:var(--accent);}
  .cal-day.selected{background:var(--accent); color:#fff;}

  /* Analytics Modal */
  .modal-overlay{
    display:none;
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.4);
    z-index:100;
    align-items:center; justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .analytics-modal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    width:90%;
    max-width:500px;
    max-height:80vh;
    display:flex; flex-direction:column;
    box-shadow:0 12px 32px rgba(34,34,29,0.15);
  }
  .modal-head{
    padding:20px 24px;
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .modal-head h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:20px;
    margin:0;
  }
  .modal-close{
    background:none; border:none;
    font-size:24px; line-height:1;
    color:var(--ink-muted);
    cursor:pointer;
  }
  .modal-close:hover{color:var(--danger);}
  .modal-body{
    padding:24px;
    overflow-y:auto;
  }
  .stat-row{
    margin-bottom:16px;
  }
  .stat-row:last-child{margin-bottom:0;}
  .stat-label{
    display:flex; justify-content:space-between;
    font-size:13.5px; margin-bottom:6px;
    font-family:'Inter',sans-serif;
  }
  .stat-title{font-weight:500;}
  .stat-nums{color:var(--ink-muted); font-size:12px;}
  .stat-bar-bg{
    height:6px; background:var(--line);
    border-radius:3px; overflow:hidden;
  }
  .stat-bar-fill{
    height:100%; background:var(--accent);
    border-radius:3px;
    transition:width .4s ease;
  }
  .stat-empty{
    text-align:center; color:var(--ink-muted); font-size:13.5px;
    padding:20px 0;
  }
  .stat-desc {
    font-size: 12px; color: var(--ink-muted);
    margin-bottom: 20px;
    text-align: center;
  }

  /* Columns */
  .columns{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
  }
  .col{
    padding:28px 26px;
  }
  .col + .col{
    border-left:1px solid var(--line);
  }
  .col-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .col-head h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:18px;
    margin:0;
  }
  .col-head .count{
    font-size:12px;
    color:var(--ink-muted);
  }
  .copy-btn{
    background:none;
    border:1px solid var(--line);
    font-size:11px;
    color:var(--ink-muted);
    padding:4px 9px;
    border-radius:12px;
    cursor:pointer;
  }
  .copy-btn:hover{border-color:var(--accent); color:var(--accent);}

  .empty{
    color:var(--ink-muted);
    font-size:13px;
    padding:18px 0;
    border-top:1px dashed var(--line);
    text-align:center;
  }

  /* Schedule rows */
  .block-row, .task-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .block-row:first-of-type, .task-row:first-of-type{border-top:none;}

  .check{
    flex:0 0 18px;
    width:18px; height:18px;
    border-radius:50%;
    border:1.5px solid var(--line);
    cursor:pointer;
    position:relative;
    background:none;
    padding:0;
  }
  .check.done{
    background:var(--done);
    border-color:var(--done);
  }
  .check.done::after{
    content:"";
    position:absolute;
    left:5px; top:2px;
    width:4px; height:8px;
    border:solid white;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }

  .time-tag{
    flex:0 0 62px;
    font-size:12px;
    color:var(--ink-muted);
    font-variant-numeric:tabular-nums;
  }

  .row-text{
    flex:1;
    font-size:14.5px;
    outline:none;
    border:none;
    background:none;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    padding:2px 0;
  }
  .row-text.done{
    color:var(--ink-muted);
    text-decoration:line-through;
    text-decoration-color:var(--line);
  }

  .del-btn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--ink-muted);
    font-size:16px;
    cursor:pointer;
    opacity:0;
    transition:opacity .15s;
    padding:2px 4px;
  }
  .block-row:hover .del-btn, .task-row:hover .del-btn{opacity:1;}
  .del-btn:hover{color:var(--danger);}

  /* Add row */
  .add-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .add-row input[type=text]{
    flex:1;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 10px;
    font-size:13.5px;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .add-row input[type=time]{
    width:96px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 6px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .add-row input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .add-row button{
    border:none;
    background:var(--accent);
    color:#fff;
    border-radius:var(--radius);
    padding:0 16px;
    font-size:13px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:500;
  }
  .add-row button:hover{opacity:.9;}

  footer{
    text-align:center;
    color:var(--ink-muted);
    font-size:11.5px;
    margin-top:22px;
  }

  @media (max-width:680px){
    .columns{grid-template-columns:1fr;}
    .col + .col{border-left:none; border-top:1px solid var(--line);}
    header{align-items:flex-start;}
    .progress{text-align:left;}
    .progress-bar{margin-left:0;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }

  button:focus-visible, input:focus-visible, [contenteditable]:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="date-block">
      <button class="nav-btn" id="prevDay" aria-label="Previous day">‹</button>
      <div class="date-text">
        <h1 id="dayName">—</h1>
        <p id="dayDate">—</p>
        <button class="today-btn" id="todayBtn">Jump to today</button>
      </div>
      <button class="nav-btn" id="nextDay" aria-label="Next day">›</button>
      <button class="cal-toggle" id="calToggle" aria-label="Open calendar" aria-expanded="false">📅 Calendar</button>
      <button class="cal-toggle" id="analyticsToggle" aria-label="Open analytics">📊 Analytics</button>
      <button class="sign-out-btn" id="signOutBtn" style="display:none;">Sign Out</button>
      <div class="cal-popover" id="calPopover">
        <div class="cal-head">
          <button id="calPrevMonth" aria-label="Previous month">‹</button>
          <span id="calMonthLabel">—</span>
          <button id="calNextMonth" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </div>
    <div class="header-right">
      <div class="progress">
        <div class="num" id="progressNum">0 / 0</div>
        <div class="lbl">tasks &amp; blocks done</div>
        <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="columns">
    <!-- SCHEDULE -->
    <div class="col">
      <div class="col-head">
        <h2>Schedule</h2>
        <button class="copy-btn" id="copyYesterday">copy yesterday</button>
      </div>
      <div id="scheduleList"></div>
      <div class="add-row">
        <input type="time" id="blockTime">
        <input type="text" id="blockText" placeholder="What's happening?" maxlength="80">
        <label class="repeat-lbl"><input type="checkbox" id="blockRepeat"> daily</label>
        <button id="addBlock">Add</button>
      </div>
    </div>

    <!-- TASKS -->
    <div class="col">
      <div class="col-head">
        <h2>Tasks</h2>
        <span class="count" id="taskCount">0 open</span>
      </div>
      <div id="taskList"></div>
      <div class="add-row">
        <input type="text" id="taskText" placeholder="Add a task" maxlength="80">
        <label class="repeat-lbl"><input type="checkbox" id="taskRepeat"> daily</label>
        <button id="addTask">Add</button>
      </div>
    </div>
  </div>

  <footer>Saved automatically for this device · <span id="saveStatus"></span></footer>
  
  <div class="modal-overlay" id="analyticsOverlay">
    <div class="analytics-modal">
      <div class="modal-head">
        <h2>Analytics (Last 30 Days)</h2>
        <button class="modal-close" id="closeAnalytics" aria-label="Close analytics">×</button>
      </div>
      <div class="modal-body">
        <div class="stat-desc">Completion rate of your daily routines</div>
        <div id="analyticsList"></div>
      </div>
    </div>
  </div>
</div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 class="auth-title">Daily Planner</h2>
    <p class="auth-subtitle">Sign in to sync your routines and tasks across devices.</p>
    <button class="google-btn" id="googleSignInBtn">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  Loading...
</div>

  const $ = (id) => document.getElementById(id);
  let currentDate = new Date();
  currentDate.setHours(0,0,0,0);

  function dateKey(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function isSameDay(a,b){ return dateKey(a) === dateKey(b); }

  function uid(){ return Math.random().toString(36).slice(2,9); }

  /* Theme */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    $("themeToggle").textContent = t === "dark" ? "☀️" : "🌙";
    localStorage.setItem("planner:theme", t);
  }
  applyTheme(localStorage.getItem("planner:theme") || "light");
  $("themeToggle").addEventListener("click", ()=>{
    const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(cur);
  });

  /* Routines (recurring blocks/tasks) - definitions live outside per-day data,
     completion is tracked per-day using each routine's id. */
  async function loadRoutines(){
    if(!currentUser || !db) return { blocks: [], tasks: [] };
    try{
      const docRef = doc(db, "users", currentUser.uid, "data", "routines");
      const snap = await getDoc(docRef);
      if(snap.exists()) return snap.data();
    }catch(e){ console.error(e); }
    return { blocks: [], tasks: [] };
  }
  async function saveRoutines(r){
    if(!currentUser || !db) return;
    try{
      await setDoc(doc(db, "users", currentUser.uid, "data", "routines"), r);
    }catch(e){ console.error(e); }
  }
  let routines = { blocks: [], tasks: [] };

  async function loadDay(d){
    if(!currentUser || !db) return { blocks: [], tasks: [], routineDone: {} };
    try{
      const docRef = doc(db, "users", currentUser.uid, "days", dateKey(d));
      const snap = await getDoc(docRef);
      if(snap.exists()){
        const parsed = snap.data();
        if(!parsed.routineDone) parsed.routineDone = {};
        return parsed;
      }
    }catch(e){ console.error(e); }
    return { blocks: [], tasks: [], routineDone: {} };
  }

  /* Build the combined render list: day-specific items + today's routine occurrences */
  function combinedBlocks(){
    const routineItems = routines.blocks.map(r=>({
      id: r.id, time: r.time, text: r.text,
      done: !!dayData.routineDone[r.id], isRoutine:true
    }));
    return [...routineItems, ...dayData.blocks];
  }
  function combinedTasks(){
    const routineItems = routines.tasks.map(r=>({
      id: r.id, text: r.text,
      done: !!dayData.routineDone[r.id], isRoutine:true
    }));
    return [...routineItems, ...dayData.tasks];
  }

  async function saveDay(d, data){
    if(!currentUser || !db) return;
    try{
      await setDoc(doc(db, "users", currentUser.uid, "days", dateKey(d)), data);
      flashSaved();
    }catch(e){
      $("saveStatus").textContent = "couldn't save just now";
      console.error(e);
    }
  }

  let flashTimer;
  function flashSaved(){
    $("saveStatus").textContent = "saved";
    clearTimeout(flashTimer);
    flashTimer = setTimeout(()=>{ $("saveStatus").textContent = ""; }, 1200);
  }

  let dayData = { blocks: [], tasks: [] };

  function renderHeader(){
    const opts = { weekday: 'long' };
    $("dayName").textContent = currentDate.toLocaleDateString(undefined, opts);
    $("dayDate").textContent = currentDate.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
    $("todayBtn").style.visibility = isSameDay(currentDate, new Date()) ? "hidden" : "visible";
  }

  function renderProgress(){
    const items = [...combinedBlocks(), ...combinedTasks()];
    const done = items.filter(i=>i.done).length;
    $("progressNum").textContent = done + " / " + items.length;
    $("progressFill").style.width = items.length ? Math.round(done/items.length*100) + "%" : "0%";
    const openTasks = combinedTasks().filter(t=>!t.done).length;
    $("taskCount").textContent = openTasks + (openTasks===1 ? " open" : " open");
  }

  function timeLabel(t){
    if(!t) return "";
    const [h,m] = t.split(":").map(Number);
    const ampm = h >= 12 ? "PM" : "AM";
    const h12 = ((h+11)%12)+1;
    return h12 + ":" + String(m).padStart(2,"0") + " " + ampm;
  }

  function renderSchedule(){
    const list = $("scheduleList");
    list.innerHTML = "";
    const all = combinedBlocks();
    if(all.length === 0){
      list.innerHTML = '<div class="empty">Nothing scheduled yet.</div>';
      return;
    }
    const sorted = [...all].sort((a,b)=> (a.time||"99:99").localeCompare(b.time||"99:99"));
    sorted.forEach(block=>{
      const row = document.createElement("div");
      row.className = "block-row";
      row.innerHTML = `
        <button class="check ${block.done?"done":""}" data-id="${block.id}" data-kind="blocks" data-routine="${block.isRoutine?"1":"0"}" aria-label="Toggle done"></button>
        <input type="time" class="time-edit" value="${block.time||""}" data-id="${block.id}" data-kind="blocks" data-routine="${block.isRoutine?"1":"0"}">
        <span class="row-text ${block.done?"done":""}" contenteditable="true" data-id="${block.id}" data-kind="blocks" data-routine="${block.isRoutine?"1":"0"}">${escapeHtml(block.text)}</span>
        ${block.isRoutine ? '<span class="repeat-badge">daily</span>' : ""}
        <button class="del-btn" data-id="${block.id}" data-kind="blocks" data-routine="${block.isRoutine?"1":"0"}" aria-label="Delete">×</button>
      `;
      list.appendChild(row);
    });
  }

  function renderTasks(){
    const list = $("taskList");
    list.innerHTML = "";
    const all = combinedTasks();
    if(all.length === 0){
      list.innerHTML = '<div class="empty">No tasks yet — add one below.</div>';
      return;
    }
    all.forEach(task=>{
      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = `
        <button class="check ${task.done?"done":""}" data-id="${task.id}" data-kind="tasks" data-routine="${task.isRoutine?"1":"0"}" aria-label="Toggle done"></button>
        <span class="row-text ${task.done?"done":""}" contenteditable="true" data-id="${task.id}" data-kind="tasks" data-routine="${task.isRoutine?"1":"0"}">${escapeHtml(task.text)}</span>
        ${task.isRoutine ? '<span class="repeat-badge">daily</span>' : ""}
        <button class="del-btn" data-id="${task.id}" data-kind="tasks" data-routine="${task.isRoutine?"1":"0"}" aria-label="Delete">×</button>
      `;
      list.appendChild(row);
    });
  }

  function escapeHtml(s){
    const div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function renderAll(){
    renderHeader();
    renderSchedule();
    renderTasks();
    renderProgress();
  }

  async function persist(){
    await saveDay(currentDate, dayData);
    renderProgress();
  }

  document.addEventListener("click", (e)=>{
    const t = e.target;
    if(t.classList.contains("check")){
      const kind = t.dataset.kind, id = t.dataset.id, isRoutine = t.dataset.routine === "1";
      if(isRoutine){
        dayData.routineDone[id] = !dayData.routineDone[id];
      } else {
        const item = dayData[kind].find(i=>i.id===id);
        if(item){ item.done = !item.done; }
      }
      renderAll(); persist();
    }
    if(t.classList.contains("del-btn")){
      const kind = t.dataset.kind, id = t.dataset.id, isRoutine = t.dataset.routine === "1";
      if(isRoutine){
        routines[kind] = routines[kind].filter(i=>i.id!==id);
        saveRoutines(routines);
      } else {
        dayData[kind] = dayData[kind].filter(i=>i.id!==id);
      }
      renderAll(); persist();
    }
  });

  document.addEventListener("blur", (e)=>{
    const t = e.target;
    if(t.classList && t.classList.contains("row-text")){
      const kind = t.dataset.kind, id = t.dataset.id, isRoutine = t.dataset.routine === "1";
      const newText = t.textContent.trim();
      if(isRoutine){
        const item = routines[kind].find(i=>i.id===id);
        if(item){
          if(newText){ item.text = newText; saveRoutines(routines); }
          else { t.textContent = item.text; }
        }
      } else {
        const item = dayData[kind].find(i=>i.id===id);
        if(item){
          if(newText){ item.text = newText; persist(); }
          else { t.textContent = item.text; }
        }
      }
    }
  }, true);

  document.addEventListener("change", (e)=>{
    const t = e.target;
    if(t.classList.contains("time-edit")){
      const id = t.dataset.id, isRoutine = t.dataset.routine === "1";
      if(isRoutine){
        const item = routines.blocks.find(i=>i.id===id);
        if(item){ item.time = t.value; saveRoutines(routines); }
      } else {
        const item = dayData.blocks.find(i=>i.id===id);
        if(item){ item.time = t.value; }
      }
      renderAll(); persist();
    }
  });

  $("addBlock").addEventListener("click", ()=>{
    const time = $("blockTime").value;
    const text = $("blockText").value.trim();
    if(!text) return;
    if($("blockRepeat").checked){
      routines.blocks.push({ id: uid(), time, text });
      saveRoutines(routines);
    } else {
      dayData.blocks.push({ id: uid(), time, text, done:false });
    }
    $("blockText").value = "";
    $("blockRepeat").checked = false;
    renderAll(); persist();
  });
  $("blockText").addEventListener("keydown", (e)=>{ if(e.key==="Enter") $("addBlock").click(); });

  $("addTask").addEventListener("click", ()=>{
    const text = $("taskText").value.trim();
    if(!text) return;
    if($("taskRepeat").checked){
      routines.tasks.push({ id: uid(), text });
      saveRoutines(routines);
    } else {
      dayData.tasks.push({ id: uid(), text, done:false });
    }
    $("taskText").value = "";
    $("taskRepeat").checked = false;
    renderAll(); persist();
  });
  $("taskText").addEventListener("keydown", (e)=>{ if(e.key==="Enter") $("addTask").click(); });

  $("prevDay").addEventListener("click", ()=> changeDay(-1));
  $("nextDay").addEventListener("click", ()=> changeDay(1));
  $("todayBtn").addEventListener("click", ()=>{
    currentDate = new Date(); currentDate.setHours(0,0,0,0);
    loadAndRender();
  });

  $("copyYesterday").addEventListener("click", async ()=>{
    const y = new Date(currentDate);
    y.setDate(y.getDate()-1);
    const yData = await loadDay(y);
    if(yData.blocks.length === 0){
      $("saveStatus").textContent = "yesterday had no schedule";
      setTimeout(()=>{ $("saveStatus").textContent=""; }, 1500);
      return;
    }
    const copied = yData.blocks.map(b=>({ id: uid(), time:b.time, text:b.text, done:false }));
    dayData.blocks = [...dayData.blocks, ...copied];
    renderAll(); persist();
  });

  async function changeDay(delta){
    currentDate.setDate(currentDate.getDate()+delta);
    await loadAndRender();
  }

  async function loadAndRender(){
    dayData = await loadDay(currentDate);
    renderAll();
  }

  /* Calendar popover */
  let calMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
  const DOW = ["S","M","T","W","T","F","S"];

  function renderCalendar(){
    $("calMonthLabel").textContent = calMonth.toLocaleDateString(undefined, { month:'long', year:'numeric' });
    const grid = $("calGrid");
    grid.innerHTML = "";
    DOW.forEach(d=>{
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      grid.appendChild(el);
    });
    const firstOfMonth = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(firstOfMonth);
    gridStart.setDate(gridStart.getDate() - startOffset);
    const today = new Date(); today.setHours(0,0,0,0);

    for(let i=0;i<42;i++){
      const d = new Date(gridStart);
      d.setDate(gridStart.getDate()+i);
      const btn = document.createElement("button");
      btn.className = "cal-day";
      btn.textContent = d.getDate();
      if(d.getMonth() !== calMonth.getMonth()) btn.classList.add("other-month");
      if(isSameDay(d, today)) btn.classList.add("today");
      if(isSameDay(d, currentDate)) btn.classList.add("selected");
      btn.addEventListener("click", async ()=>{
        currentDate = d;
        closeCalendar();
        await loadAndRender();
      });
      grid.appendChild(btn);
    }
  }

  function openCalendar(){
    calMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    renderCalendar();
    $("calPopover").classList.add("open");
    $("calToggle").setAttribute("aria-expanded","true");
  }
  function closeCalendar(){
    $("calPopover").classList.remove("open");
    $("calToggle").setAttribute("aria-expanded","false");
  }
  function toggleCalendar(){
    $("calPopover").classList.contains("open") ? closeCalendar() : openCalendar();
  }

  $("calToggle").addEventListener("click", (e)=>{ e.stopPropagation(); toggleCalendar(); });
  $("calPrevMonth").addEventListener("click", (e)=>{
    e.stopPropagation();
    calMonth.setMonth(calMonth.getMonth()-1);
    renderCalendar();
  });
  $("calNextMonth").addEventListener("click", (e)=>{
    e.stopPropagation();
    calMonth.setMonth(calMonth.getMonth()+1);
    renderCalendar();
  });
  $("calPopover").addEventListener("click", (e)=> e.stopPropagation());
  document.addEventListener("click", ()=> closeCalendar());
  document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeCalendar(); });

  /* Analytics */
  function getPast30DaysKeys() {
    const keys = [];
    const today = new Date();
    today.setHours(0,0,0,0);
    for(let i = 0; i < 30; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      keys.push("planner:" + dateKey(d));
    }
    return keys;
  }

  async function renderAnalytics() {
    const list = $("analyticsList");
    list.innerHTML = "Loading stats...";
    
    // Combine all routines
    const allRoutines = [...routines.blocks, ...routines.tasks];
    if(allRoutines.length === 0) {
      list.innerHTML = '<div class="stat-empty">No daily routines found.</div>';
      return;
    }

    const keys = getPast30DaysKeys();
    
    // Calculate stats
    const stats = {};
    allRoutines.forEach(r => {
      stats[r.id] = { text: r.text, completed: 0, total: 30 };
    });

    if(currentUser && db) {
      const promises = keys.map(k => getDoc(doc(db, "users", currentUser.uid, "days", k)));
      try {
        const snaps = await Promise.all(promises);
        snaps.forEach(snap => {
          if(snap.exists()) {
            const parsed = snap.data();
            if(parsed.routineDone) {
              allRoutines.forEach(r => {
                if(parsed.routineDone[r.id]) {
                  stats[r.id].completed++;
                }
              });
            }
          }
        });
      } catch(e) { console.error(e); }
    }

    list.innerHTML = "";

    allRoutines.forEach(r => {
      const stat = stats[r.id];
      const pct = Math.round((stat.completed / stat.total) * 100);
      const row = document.createElement("div");
      row.className = "stat-row";
      row.innerHTML = `
        <div class="stat-label">
          <span class="stat-title">${escapeHtml(stat.text)}</span>
          <span class="stat-nums">${pct}% &nbsp;(${stat.completed}/${stat.total})</span>
        </div>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill" style="width:0%"></div>
        </div>
      `;
      list.appendChild(row);

      // Animate width
      setTimeout(() => {
        row.querySelector(".stat-bar-fill").style.width = pct + "%";
      }, 50);
    });
  }

  function openAnalytics() {
    renderAnalytics();
    $("analyticsOverlay").classList.add("open");
  }
  function closeAnalytics() {
    $("analyticsOverlay").classList.remove("open");
  }

  $("analyticsToggle").addEventListener("click", (e) => { e.stopPropagation(); openAnalytics(); });
  $("closeAnalytics").addEventListener("click", closeAnalytics);
  $("analyticsOverlay").addEventListener("click", (e) => { if(e.target === $("analyticsOverlay")) closeAnalytics(); });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeAnalytics(); });

  /* Reminders — fires a browser notification when a scheduled block's time arrives.
     Only works while this tab is open (no service worker), and needs permission. */
  const notifiedToday = new Set();
  function checkReminders(){
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date();
    if(!isSameDay(currentDate, now)) return; // only alert for today's view
    const hh = String(now.getHours()).padStart(2,"0");
    const mm = String(now.getMinutes()).padStart(2,"0");
    const nowStr = hh + ":" + mm;
    combinedBlocks().forEach(b=>{
      const key = dateKey(now) + ":" + b.id;
      if(b.time === nowStr && !b.done && !notifiedToday.has(key)){
        notifiedToday.add(key);
        new Notification("Scheduled: " + b.text, { body: timeLabel(b.time), silent:false });
      }
    });
  }
  if("Notification" in window && Notification.permission === "default"){
    // Ask once, on first click anywhere, rather than immediately on load.
    const askOnce = ()=>{ Notification.requestPermission(); document.removeEventListener("click", askOnce); };
    document.addEventListener("click", askOnce);
  }
  setInterval(checkReminders, 20000);

  /* Auth Flow */
  if (auth) {
    getRedirectResult(auth).catch(err => console.error("Redirect auth error:", err));
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        $("authOverlay").classList.add("hidden");
        $("signOutBtn").style.display = "inline-block";
        routines = await loadRoutines();
        await loadAndRender();
        document.querySelector('.wrap').classList.remove('hidden');
        $("loadingOverlay").classList.add("hidden");
      } else {
        currentUser = null;
        $("authOverlay").classList.remove("hidden");
        $("signOutBtn").style.display = "none";
        document.querySelector('.wrap').classList.add('hidden');
        $("loadingOverlay").classList.add("hidden");
      }
    });
  } else {
    $("loadingOverlay").classList.add("hidden");
  }

  $("googleSignInBtn").addEventListener("click", () => {
    if(!auth) {
      alert("Firebase is not configured. Please add your config to the daily-planner.html file.");
      return;
    }
    const provider = new GoogleAuthProvider();
    const isMobileInApp = /FBAN|FBAV|Instagram|Line|WhatsApp|MicroMessenger/i.test(navigator.userAgent);
    if (isMobileInApp) {
      signInWithRedirect(auth, provider).catch(err => alert("Login failed: " + err.message));
    } else {
      signInWithPopup(auth, provider).catch(err => {
        console.error("Popup login error:", err);
        signInWithRedirect(auth, provider).catch(rErr => alert("Login failed: " + rErr.message));
      });
    }
  });

  $("signOutBtn").addEventListener("click", () => {
    if(auth) signOut(auth);
  });
})();
</script>
</body>
</html>
